<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>백현우 알고리즘 챌린지</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#F2F4FC; --surface:#FFFFFF; --surface-2:#EDF0FB; --ink:#1B2559; --ink-2:#424B7D; --muted:#6A719A; --line:#DCE1F2;
  --blue:#3D6BFF; --blue-d:#2347C9; --violet:#7B5CFF; --navy:#1B2559; --ok:#109E74; --bad:#E5484D; --warn:#C98800;
  --shadow:0 1px 2px rgba(27,37,89,.06),0 8px 24px -12px rgba(27,37,89,.18);
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --display:'Do Hyeon','IBM Plex Sans KR',system-ui,sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1330; --surface:#161C3E; --surface-2:#1D2450; --ink:#E9ECFF; --ink-2:#BFC6EE; --muted:#8E96C8; --line:#2B3366;
  --blue:#6C8CFF; --blue-d:#8EA6FF; --violet:#9C85FF; --ok:#3BD3A1; --bad:#FF6B70; --warn:#F2B33A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0E1330; --surface:#161C3E; --surface-2:#1D2450; --ink:#E9ECFF; --ink-2:#BFC6EE; --muted:#8E96C8; --line:#2B3366; --blue:#6C8CFF; --blue-d:#8EA6FF; --violet:#9C85FF; --ok:#3BD3A1; --bad:#FF6B70; --warn:#F2B33A; color-scheme:dark;}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 85% -10%,rgba(123,92,255,.10),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(61,107,255,.08),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{margin:0;font-weight:400}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center} .row.end{justify-content:flex-end} .row.between{justify-content:space-between}

/* 상단 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;justify-content:space-between;padding:10px 20px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;border:0;background:none;font-family:var(--display);font-size:21px;color:var(--ink);padding:4px}
.logo svg{width:30px;height:30px;display:block}
.top nav{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.top nav button{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--ink-2);font-weight:600;font-size:14px}
.top nav button.on{background:var(--ink);color:var(--surface)}
.top nav button:not(.on):hover{background:var(--surface-2)}
.mpick{max-width:260px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;margin-right:6px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:12px;padding:10px 16px;font-weight:700;border:1px solid transparent;font-size:15px;transition:transform .12s,background .15s,box-shadow .15s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.sm{padding:7px 12px;font-size:13.5px;border-radius:10px}
.btn.big{padding:15px 24px;font-size:17px;border-radius:16px}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--blue-d)}
.btn.run{background:linear-gradient(135deg,#3D6BFF,#7B5CFF);color:#fff;box-shadow:0 8px 20px -8px rgba(76,90,255,.7)}
.btn.run:hover:not(:disabled){box-shadow:0 10px 26px -8px rgba(76,90,255,.9)}
.btn.ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.ghost:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
.btn.ghost.active{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 10%,var(--surface));color:var(--blue)}
.btn.icon{padding:9px}
.btn.right{background:var(--ok);color:#fff} .btn.wrong{background:var(--bad);color:#fff}
.link{border:0;background:none;color:var(--blue);font-weight:700;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:9px;font-size:13.5px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg.wide{display:flex}.seg.wide button{flex:1}

/* 홈 */
.home{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;background:linear-gradient(140deg,#1B2559 0%,#2D2F86 55%,#5B3FD1 100%);border-radius:30px;padding:44px 48px;color:#fff;position:relative;overflow:hidden;box-shadow:0 30px 60px -30px rgba(27,37,89,.7)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(90deg,transparent,#000 70%);pointer-events:none}
.hero h1{font-family:var(--display);line-height:1;display:flex;flex-direction:column;gap:6px;position:relative;z-index:1}
.hero h1 span:first-child{font-size:clamp(46px,7vw,84px);letter-spacing:-.01em;color:#FFE27A;text-shadow:0 4px 0 #C9862A}
.hero h1 span:last-child{font-size:clamp(30px,4.2vw,50px)}
.hero .sub{font-size:18px;color:#D9DEFF;margin:18px 0 26px;position:relative;z-index:1}
.hero .row{position:relative;z-index:1}
.hero .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.3)}
.hero .btn.ghost:hover{background:rgba(255,255,255,.18);color:#fff;border-color:#fff}
.hero .fine{margin:22px 0 0;color:#B9C1F5;font-size:14px;position:relative;z-index:1}
.hero .fine b{color:#fff}
.hero-art{position:relative;z-index:1}
.hero-art svg{width:100%;max-width:400px;display:block;margin:0 auto;filter:drop-shadow(0 18px 24px rgba(0,0,0,.25))}
.hero-art .speech{position:absolute;top:8px;left:-8px;background:#fff;color:var(--navy);padding:12px 16px;border-radius:18px 18px 4px 18px;font-weight:700;font-size:14.5px;line-height:1.45;box-shadow:0 10px 24px -8px rgba(0,0,0,.4);max-width:240px;animation:pop .6s .3s both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}}
.home-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:20px;margin-top:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;box-shadow:var(--shadow)}
.panel h2{font-family:var(--display);font-size:24px;margin-bottom:14px}
.side-col{display:flex;flex-direction:column;gap:20px}
.mlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.mcard{width:100%;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--surface-2);border:1px solid transparent;border-radius:16px;padding:12px 14px;transition:border-color .15s,background .15s}
.mcard:hover{border-color:var(--blue);background:var(--surface)}
.m-no{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--display);font-size:24px;background:var(--ink);color:var(--surface)}
.mcard.solved .m-no{background:var(--ok);color:#fff}
.m-t{display:flex;flex-direction:column;min-width:0}
.m-t b{font-size:16px}
.m-t small{color:var(--muted);font-size:13px;line-height:1.4}
.m-side{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.lvl{color:#F2A900;letter-spacing:1px;font-size:14px}.lvl i{color:var(--line);font-style:normal}
.m-st{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.rec-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.rec-nums div{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column}
.rec-nums b{font-family:var(--display);font-size:30px;line-height:1.1}
.rec-nums small{font-size:15px;color:var(--muted)}
.rec-nums span{font-size:12.5px;color:var(--muted)}
.learn p{margin:0 0 12px}
.structs{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px}
.structs li{display:flex;align-items:center;gap:8px;font-size:14px}
.structs b{margin-right:4px}
.c-seq,.c-rep,.c-sel{display:inline-block;width:12px;height:12px;border-radius:4px;flex:none}
.c-seq{background:var(--blue)} .c-rep{background:#E0A400} .c-sel{background:#18A974}

/* 플레이 */
.play{display:grid;grid-template-columns:270px minmax(0,1fr) 410px;grid-template-areas:"info sim ed";gap:16px;padding:16px;height:calc(100vh - 58px);height:calc(100dvh - 58px - env(safe-area-inset-top,0px));min-height:620px}
.mission-info{grid-area:info;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:auto;box-shadow:var(--shadow)}
.info-toggle{display:none}
.mi-inner{padding:20px}
.mi-no{font-weight:700;color:var(--muted);margin:0 0 4px;display:flex;justify-content:space-between;font-size:14px}
.mission-info h2{font-family:var(--display);font-size:25px;line-height:1.2;margin-bottom:10px}
.mi-goal{margin:0 0 16px;padding:12px 14px;background:color-mix(in srgb,var(--blue) 9%,var(--surface));border-radius:12px;font-weight:600}
.mission-info h4{font-size:13px;font-weight:800;color:var(--ink-2);margin:16px 0 6px}
.mission-info h4 small{color:var(--muted);font-weight:600}
.ticks,.rules{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px}
.ticks li,.rules li{padding-left:20px;position:relative}
.ticks li::before{content:"";position:absolute;left:2px;top:6px;width:10px;height:6px;border-left:2.4px solid var(--ok);border-bottom:2.4px solid var(--ok);transform:rotate(-45deg)}
.rules li::before{content:"";position:absolute;left:4px;top:8px;width:6px;height:6px;border-radius:2px;background:var(--violet)}
.hint{display:flex;gap:9px;margin:0 0 8px;padding:10px 12px;background:#FFF7DB;border-radius:12px;font-size:13.5px;color:#5A4500}
.hint b{flex:none;width:20px;height:20px;border-radius:7px;background:#F2B21B;color:#fff;display:grid;place-items:center;font-size:12px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hint{background:#3A3115;color:#FFE7A3}}
.mi-rec{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.mi-rec span{font-size:12px;font-weight:700;background:var(--surface-2);border-radius:999px;padding:4px 10px;color:var(--muted)}
.mi-rec .ok{background:var(--ok);color:#fff}
.sim{grid-area:sim;display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0;position:relative}
.sim-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.view-label{font-weight:700;font-size:13px;color:var(--muted)}
.hero-state{font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);padding:5px 11px;border-radius:999px}
.stage-wrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;overflow:hidden}
.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;container-type:size}
.stage-board{position:relative;filter:drop-shadow(0 16px 22px rgba(27,37,89,.18))}
.stage-board svg{display:block;width:100%;height:100%}
.hero-move{transition:transform var(--t) cubic-bezier(.4,.1,.3,1)}
.obj-move{transition:transform .5s cubic-bezier(.4,.1,.3,1)}
.facing{animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{opacity:.55}}
.walking .legs rect:first-child{animation:stepA .3s ease-in-out infinite alternate}
.walking .legs rect:nth-child(2){animation:stepA .3s ease-in-out infinite alternate-reverse}
@keyframes stepA{to{transform:translateY(-3px)}}
.walking{animation:bob .3s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-2px)}}
.shake .stage-board{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.mark-ring{animation:ring 1s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes ring{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
.goal-pulse{animation:gp 1.8s ease-in-out infinite}
@keyframes gp{50%{opacity:.75}}
.rain line{animation:rain .6s linear infinite}
@keyframes rain{from{transform:translateY(-6px);opacity:.3}to{transform:translateY(6px);opacity:1}}
.drops circle{animation:drop .5s ease-in infinite}
@keyframes drop{from{transform:translateY(-6px);opacity:.2}}
.bubble{position:absolute;transform:translate(calc(-1 * var(--ax,50%)),-100%);background:#fff;color:#1B2559;border:2px solid #1B2559;border-radius:16px;padding:8px 12px;font-weight:700;font-size:clamp(12px,1.35vw,15px);line-height:1.35;max-width:min(320px,70%);width:max-content;box-shadow:0 8px 18px -8px rgba(27,37,89,.5);animation:pop .25s both;pointer-events:none;z-index:2}
.bubble::after{content:"";position:absolute;left:var(--ax,50%);bottom:-9px;width:14px;height:14px;background:#fff;border-right:2px solid #1B2559;border-bottom:2px solid #1B2559;transform:translateX(-50%) rotate(45deg)}
.bubble.mood-hurt,.bubble.mood-confused,.bubble.mood-shock{border-color:#E5484D}
.bubble.mood-hurt::after,.bubble.mood-confused::after,.bubble.mood-shock::after{border-color:#E5484D}
.cond-banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#18A974;color:#fff;font-weight:800;padding:8px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;animation:pop .2s both}
.now-line{position:absolute;left:12px;bottom:12px;background:rgba(27,37,89,.88);color:#fff;font-size:13px;padding:6px 12px;border-radius:10px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now-line b{color:#FFE27A;margin-right:6px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls .btn{padding:9px 13px;font-size:14px}.controls .btn.run{padding:10px 20px;font-size:16px}
.speed{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--muted);margin-left:auto}
.speed input{width:72px;accent-color:var(--blue)}
.speed span:last-child{width:36px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-10px;border-radius:2px;animation:fall 2.2s cubic-bezier(.3,.5,.4,1) both}
@keyframes fall{to{top:105%;transform:rotate(540deg) translateX(30px)}}

/* 결과 */
.result{flex:none;max-height:42%;overflow:auto;background:var(--surface);border-radius:20px;padding:20px 22px;box-shadow:var(--shadow);border:2px solid var(--line);animation:pop .3s both}
.result.lose{border-color:color-mix(in srgb,var(--bad) 55%,var(--line))}
.result.win{border-color:color-mix(in srgb,var(--ok) 55%,var(--line))}
.res-kicker{margin:0;font-weight:800;font-size:13px;color:var(--bad)}
.win .res-kicker{color:var(--ok)}
.result h3{font-family:var(--display);font-size:26px;margin:2px 0 8px}
.res-say{margin:0 0 12px;padding:10px 14px;background:var(--surface-2);border-radius:12px;font-weight:600}
.res-block{margin:0 0 10px}
.res-block b{font-size:13px;color:var(--ink-2)}
.res-block p{margin:2px 0 0}
.res-block.q p{font-weight:700;color:var(--violet)}
.ex{margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)}
.result .res-cols{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.res-top{display:flex;justify-content:space-between;align-items:flex-start}
.stars span{font-size:34px;color:var(--line);margin-left:2px}
.stars span.on{color:#FFC21A;text-shadow:0 2px 0 #D18E00}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.score{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.score b{font-size:13px}
.score small{font-size:11.5px;color:var(--muted)}
.meter{display:flex;gap:3px}.meter i{flex:1;height:7px;border-radius:4px;background:var(--line)}.meter i.on{background:var(--blue)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.badge{background:linear-gradient(135deg,#FFE27A,#FFC21A);color:#5A3B00;font-weight:800;font-size:12.5px;padding:5px 10px;border-radius:999px}
.challenge{margin:12px 0 0;font-size:13.5px;font-weight:700;color:var(--violet)}

/* 편집기 */
.ed-col{grid-area:ed;display:flex;flex-direction:column;gap:10px;min-height:0}
.editor{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.ed-head{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 10px;gap:8px;flex-wrap:wrap}
.ed-head h2{font-family:var(--display);font-size:22px}
.lines{list-style:none;margin:0;padding:4px 10px 10px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:120px}
.empty-lines{padding:24px 14px;text-align:center;color:var(--muted);font-size:14px;border:2px dashed var(--line);border-radius:14px}
.ln{display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:6px;position:relative}
.ln-no{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface-2);color:var(--muted);transition:background .2s,color .2s}
.ln-body{display:flex;align-items:stretch;min-width:0}
.ln-guides{display:flex;flex:none}
.ln-guides i{width:16px;border-left:2px dotted color-mix(in srgb,var(--violet) 55%,transparent);margin-left:6px}
.ln-main{flex:1;min-width:0;border:1px solid var(--line);border-left:4px solid var(--cat);border-radius:10px;background:var(--surface);transition:border-color .2s,box-shadow .2s,background .2s}
.ln-main input{width:100%;border:0;background:transparent;padding:7px 10px 0;font-size:14.5px;font-weight:600;outline:none}
.ln-main input:disabled{opacity:1}
.ln-tag{display:block;font-size:11.5px;color:var(--muted);padding:0 10px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln-tag b{color:var(--cat);margin-right:5px;font-weight:800}
.ln-tag.bad{color:var(--bad)}.ln-tag.bad b{color:var(--bad)}
.ln-main:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
.ln.done .ln-no{background:color-mix(in srgb,var(--ok) 18%,var(--surface));color:var(--ok)}
.ln.done .ln-main{opacity:.72}
.ln.cur .ln-no{background:var(--blue);color:#fff}
.ln.cur .ln-main{background:color-mix(in srgb,var(--blue) 10%,var(--surface));border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 22%,transparent)}
.ln.err .ln-no{background:var(--bad);color:#fff}
.ln.err .ln-main{background:color-mix(in srgb,var(--bad) 9%,var(--surface));border-color:var(--bad)}
.ln-tools{display:flex;gap:1px}
.ln-tools button{border:0;background:none;width:26px;height:28px;border-radius:7px;display:grid;place-items:center;color:var(--muted)}
.ln-tools button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.ln-tools .del:hover:not(:disabled){color:var(--bad)}

    });

      if (res.every(r => r.act)) return { acts: res.map(r => r.act) };

      while (stack.length > 1 && stack[stack.length - 1].ind >= ind) stack.pop();
      const parent = stack[stack.length - 1].node;

          <text x=${X + 40} y=${Y + 76} text-anchor="middle" font-size="10" fill="#1B2559" font-weight="700">${o.open ? '열림' : '닫힘'}</text>
          ${ring}${tag}</g>`;
      case 'shelf': return html`<g><rect x=${X + 6} y=${Y - 4} width="68" height="70" rx="5" fill="#C59466"/><rect x=${X + 6} y=${Y + 56} width="68" height="10" fill="#A0744A"/></g>`;
      case 'can': {
        if (o.at === 'hand') return null;
        return html`<g><path d=${`M${X + 24} ${Y + 22} h24 v20 a4 4 0 0 1 -4 4 h-16 a4 4 0 0 1 -4 -4z`} fill="#34B27B" stroke="#1D7A51" stroke-width="2"/><path d=${`M${X + 48} ${Y + 28} L${X + 62} ${Y + 18}`} stroke="#1D7A51" stroke-width="4" stroke-linecap="round"/><path d=${`M${X + 28} ${Y + 22} Q${X + 36} ${Y + 8} ${X + 44} ${Y + 22}`} stroke="#1D7A51" stroke-width="3" fill="none"/>${ring}${tag}</g>`;
      }
      case 'sink': return html`<g><rect x=${X + 6} y=${Y - 8} width="68" height="70" rx="8" fill="#E9EEF7" stroke="#B9C3D8" stroke-width="2"/><ellipse cx=${X + 40} cy=${Y + 30} rx="24" ry="17" fill="#C9D6EC"/><rect x=${X + 36} y=${Y - 6} width="8" height="18" rx="3" fill="#8F9BB3"/><rect x=${X + 36} y=${Y + 8} width="14" height="6" rx="3" fill="#8F9BB3"/>${ring}${tag}</g>`;
      case 'plant': {
        const w = o.water, lush = w >= o.need;
        const leaf = lush ? '#2FBF71' : w > 0 ? '#7FB36A' : '#A9A15E';
        const droop = lush ? 0 : w > 0 ? 8 : 16;
        return html`<g>
          ${o.over ? html`<ellipse cx=${X + 40} cy=${Y + 72} rx="34" ry="9" fill="#6FB7FF" opacity=".6"/>` : null}
          <path d=${`M${X + 40} ${Y + 40} Q${X + 22} ${Y + 12 + droop} ${X + 12} ${Y + 22 + droop * 1.4}`} stroke=${leaf} stroke-width="9" fill="none" stroke-linecap="round"/>
          <path d=${`M${X + 40} ${Y + 40} Q${X + 58} ${Y + 12 + droop} ${X + 68} ${Y + 22 + droop * 1.4}`} stroke=${leaf} stroke-width="9" fill="none" stroke-linecap="round"/>
          <path d=${`M${X + 40} ${Y + 42} L${X + 40} ${Y + 6 + droop}`} stroke=${leaf} stroke-width="6" stroke-linecap="round"/>
          ${lush ? html`<circle cx=${X + 40} cy=${Y + 6} r="7" fill="#FF8FB1"/><circle cx=${X + 40} cy=${Y + 6} r="3" fill="#FFE27A"/>` : null}
          <path d=${`M${X + 20} ${Y + 40} h40 l-5 30 h-30z`} fill="#D9895B"/><rect x=${X + 17} y=${Y + 36} width="46" height="9" rx="3" fill="#C2734A"/>
          <g>${Array.from({ length: o.need }).map((_, i) => html`<circle key=${i} cx=${X + 33 + i * 14} cy=${Y + 58} r="4.5" fill=${i < w ? '#4DA3FF' : '#fff'} stroke="#4DA3FF" stroke-width="1.5"/>`)}</g>
          ${ring}${tag}</g>`;
      }
      case 'stand': return html`<g><rect x=${X + 24} y=${Y + 20} width="32" height="48" rx="6" fill="#5B6377"/><ellipse cx=${X + 40} cy=${Y + 20} rx="16" ry="6" fill="#737B91"/></g>`;
      case 'umbrella': {
        if (o.at === 'hand' || o.at === 'friend') return null;
        if (o.at === 'floor') return html`<g><path d=${`M${X + 16} ${Y + 52} L${X + 62} ${Y + 40}`} stroke="#2B2F5C" stroke-width="3" stroke-linecap="round"/><path d=${`M${X + 18} ${Y + 46} L${X + 50} ${Y + 38} L${X + 52} ${Y + 48} L${X + 20} ${Y + 56}Z`} fill="#7B5CFF"/>${ring}${tag}</g>`;
        return html`<g><path d=${`M${X + 34} ${Y - 6} L${X + 46} ${Y - 6} L${X + 44} ${Y + 22} L${X + 36} ${Y + 22}Z`} fill="#7B5CFF" stroke="#4B33B8" stroke-width="1.5"/><path d=${`M${X + 40} ${Y - 6} Q${X + 40} ${Y - 16} ${X + 47} ${Y - 14}`} stroke="#2B2F5C" stroke-width="2.5" fill="none"/>${ring}${tag}</g>`;
      }
      case 'friend': return html`<g transform=${`translate(${X} ${Y})`}><${FriendSprite} hasUmbrella=${o.has === 'umbrella'} rain=${st.weather === 'rain'}/><text x="40" y="-4" text-anchor="middle" font-size="12" font-weight="800" fill="#B23A6B">이영</text>${mark ? html`<circle cx="40" cy="40" r="40" fill="none" stroke="#3D6BFF" stroke-width="3" class="mark-ring"/>` : null}${known ? html`<g><circle cx="70" cy="6" r="8" fill="#3D6BFF"/><path d="M66 6 l3 3 l5 -6" stroke="#fff" stroke-width="2" fill="none"/></g>` : null}</g>`;
    }
    return null;
  }

  function Stage({ mission, frame, speed, playing, bubble, win, present }) {
    const st = frame.s;
    const W = mission.map[0].length, H = mission.map.length;
    const h = st.hero;
    const vbH = H * CELL + PADTOP;
    const objs = Object.keys(st.objs).map(k => ({ k, o: st.objs[k] }));
    const heroY = h.on === 'chair' ? (st.objs.chair.y - 0.55) : h.y;
    const heroX = h.on === 'chair' ? st.objs.chair.x : h.x;
    const bump = frame.bump ? frame.bump : [0, 0];
    const tx = (heroX + bump[0] * 0.28) * CELL, ty = (heroY + bump[1] * 0.28) * CELL;
    const items = objs.map(({ k, o }) => ({ y: o.y + (o.kind === 'chair' && !o.pulled ? -0.25 : 0) + (o.kind === 'book' || o.kind === 'can' || (o.kind === 'umbrella' && o.at === 'stand') ? 0.01 : 0), el: html`<${ObjShape} key=${k} id=${k} o=${o} st=${st} mark=${frame.mark === k}/>` }));
    items.push({ y: heroY + 0.02, hero: true });
    items.sort((a, b) => a.y - b.y);
    const dur = Math.max(160, Math.round(380 / speed));
    const arrow = HW.DV[h.dir];
    const bx = ((heroX + 0.5) / W) * 100;
    const by = ((heroY * CELL + PADTOP - 8) / vbH) * 100;
    const rain = mission.dual && st.weather === 'rain';
    return html`<div class=${'stage' + (frame.kind === 'bump' ? ' shake' : '') + (present ? ' present' : '')} style=${{ '--t': dur + 'ms' }}>
      <div class="stage-board" style=${{ aspectRatio: `${W * CELL} / ${vbH}`, width: `min(100cqw, ${(W * CELL / vbH * 100).toFixed(2)}cqh)` }}>
        <svg viewBox=${`0 ${-PADTOP} ${W * CELL} ${vbH}`} role="img" aria-label=${`${mission.title} 시뮬레이션 화면. 현우는 ${HW.SCREEN[h.dir]}을 보고 있어요.`}>
          <defs><clipPath id="stclip"><rect x="0" y=${-PADTOP} width=${W * CELL} height=${vbH} rx="18"/></clipPath></defs>
          <g clip-path="url(#stclip)">
            <rect x="0" y=${-PADTOP} width=${W * CELL} height=${PADTOP} fill=${mission.theme === 'maze' ? '#C3C8F0' : '#DDE3FA'}/>
            ${mission.id === 1 || mission.id === 3 ? html`<g><rect x=${W * CELL / 2 - 110} y=${-PADTOP + 6} width="220" height="34" rx="4" fill="#2E5B4B" stroke="#8C6A45" stroke-width="4"/><text x=${W * CELL / 2} y=${-PADTOP + 28} text-anchor="middle" font-size="13" fill="#E9F3EC" font-weight="700">${mission.id === 1 ? '오늘의 목표: 알고리즘!' : '준비물: 국어책'}</text></g>` : null}
            ${mission.dual ? html`<g>${[1, 4, 7].map(i => html`<g key=${i}><rect x=${i * CELL + 6} y=${-PADTOP + 6} width=${CELL * 1.6} height="34" rx="4" fill=${rain ? '#6C7AA8' : '#A9DBFF'} stroke="#fff" stroke-width="3"/>${rain ? html`<g class="rain">${[0, 1, 2, 3, 4, 5].map(j => html`<line key=${j} x1=${i * CELL + 14 + j * 20} y1=${-PADTOP + 10} x2=${i * CELL + 8 + j * 20} y2=${-PADTOP + 34} stroke="#E4ECFF" stroke-width="2" stroke-linecap="round"/>`)}</g>` : html`<circle cx=${i * CELL + 30} cy=${-PADTOP + 22} r="9" fill="#FFD43B"/>`}</g>`)}</g>` : null}
            ${mission.map.map((row, y) => row.split('').map((t, x) => html`<${Tile} key=${x + '-' + y} t=${t} x=${x} y=${y} mission=${mission} theme=${mission.theme}/>`))}
            ${st.puddle ? html`<ellipse cx=${st.puddle[0] * CELL + 40} cy=${st.puddle[1] * CELL + 50} rx="32" ry="14" fill="#6FB7FF" opacity=".55"/>` : null}
            ${items.map((it, i) => it.hero ? html`<g key="hero" class="hero-move" style=${{ transform: `translate(${tx}px, ${ty}px)` }}>
                ${h.pose !== 'sit' && h.pose !== 'fall' ? html`<g class="facing" transform=${`translate(${arrow[0] * CELL} ${arrow[1] * CELL})`}><rect x="10" y="10" width="60" height="60" rx="12" fill="#3D6BFF" fill-opacity=".10" stroke="#3D6BFF" stroke-width="2.5" stroke-dasharray="7 6"/><path d=${chevron(arrow)} fill="none" stroke="#3D6BFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y=${arrow[1] > 0 ? 24 : 64} text-anchor="middle" font-size="12" font-weight="800" fill="#2347C9">앞</text></g>` : null}
                <${HeroSprite} dir=${h.dir} mood=${h.mood} pose=${h.pose} holding=${h.holding} walk=${frame.kind === 'walk' && playing}/>
                ${frame.fx === 'pour' ? html`<g class="drops">${[0, 1, 2].map(i => html`<circle key=${i} cx=${40 + arrow[0] * (34 + i * 7)} cy=${40 + arrow[1] * (30 + i * 7)} r="3" fill="#4DA3FF"/>`)}</g>` : null}
                ${frame.fx === 'fill' ? html`<g class="drops">${[0, 1, 2].map(i => html`<circle key=${i} cx=${40 + arrow[0] * 42} cy=${20 + i * 8 + arrow[1] * 30} r="3" fill="#4DA3FF"/>`)}</g>` : null}
              </g>` : React.cloneElement(it.el, { key: 'o' + i }))}
          </g>
        </svg>
        ${bubble ? html`<div class=${'bubble mood-' + (h.mood || 'idle')} style=${{ left: bx + '%', top: Math.max(4, by) + '%', '--ax': (bx < 30 ? 14 : bx > 70 ? 86 : 50) + '%' }}>${bubble}</div>` : null}
        ${win ? html`<${Confetti}/>` : null}
      </div>
    </div>`;
  }
  function chevron([dx, dy]) {
    const px = -dy, py = dx, cx = 40 + dx * 2, cy = 40 + dy * 2 + (dy === 0 ? -4 : 0);
    return `M${cx - dx * 6 + px * 10} ${cy - dy * 6 + py * 10} L${cx + dx * 6} ${cy + dy * 6} L${cx - dx * 6 - px * 10} ${cy - dy * 6 - py * 10}`;
  }
  function arrowPath([dx, dy]) {
    const cx = 40 + dx * 30, cy = 66 + dy * 18;
    const px = -dy, py = dx;
    return `M${cx + dx * 9} ${cy + dy * 6} L${cx + px * 8 - dx * 3} ${cy + py * 5 - dy * 2} L${cx - px * 8 - dx * 3} ${cy - py * 5 - dy * 2}Z`;
  }
  function Confetti() {
    const pcs = useMemo(() => Array.from({ length: 46 }).map((_, i) => ({ l: Math.random() * 100, d: Math.random() * 0.8, c: ['#3D6BFF', '#7B5CFF', '#FFC93C', '#22C59A', '#FF7A9A'][i % 5], r: Math.random() * 360, s: 6 + Math.random() * 6 })), []);
    return html`<div class="confetti" aria-hidden="true">${pcs.map((p, i) => html`<i key=${i} style=${{ left: p.l + '%', animationDelay: p.d + 's', background: p.c, transform: `rotate(${p.r}deg)`, width: p.s + 'px', height: p.s * 0.5 + 'px' }}/>`)}</div>`;
  }

  /* ===================== 편집기 ===================== */
  const CAT = { move: ['이동', '#3D6BFF'], turn: ['방향', '#7B5CFF'], check: ['확인', '#0EA5B7'], hand: ['물건', '#F08C2E'], body: ['자세', '#E0559A'], rep: ['반복', '#D99A00'], sel: ['선택', '#18A974'], err: ['?', '#E5484D'] };
  function Icon({ n }) {
    const P = { up: 'M8 13V3M3 8l5-5 5 5', down: 'M8 3v10M3 8l5 5 5-5', left: 'M13 8H3M8 3L3 8l5 5', right: 'M3 8h10M8 3l5 5-5 5', x: 'M4 4l8 8M12 4l-8 8', play: 'M5 3l8 5-8 5z', step: 'M4 3l6 5-6 5zM12 3v10', pause: 'M5 3v10M11 3v10', reset: 'M3 8a5 5 0 1 0 1.5-3.5M3 3v3h3', full: 'M3 6V3h3M13 6V3h-3M3 10v3h3M13 10v3h-3', replay: 'M8 3a5 5 0 1 1-5 5M8 3V1M8 3l2 2', plus: 'M8 3v10M3 8h10' };
    return html`<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d=${P[n]} fill=${n === 'play' || n === 'step' ? 'currentColor' : 'none'} stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }

  function Editor({ mission, lines, setLines, status, locked, insIndent, setInsIndent }) {
    const [mode, setMode] = useState('text');
    const [draft, setDraft] = useState('');
    const [bulk, setBulk] = useState(null);
    const listRef = useRef(null);
    const curLine = status.current;
    useEffect(() => { if (curLine == null || !listRef.current) return; const el = listRef.current.querySelector(`[data-ln="${curLine}"]`); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }, [curLine]);
    const upd = (i, patch) => setLines(lines.map((l, j) => j === i ? Object.assign({}, l, patch) : l));
    const move = (i, d) => { const j = i + d; if (j < 0 || j >= lines.length) return; const a = lines.slice(); [a[i], a[j]] = [a[j], a[i]]; setLines(a); };
    const del = i => setLines(lines.filter((_, j) => j !== i));
    const add = (text, ctrl) => {
      if (!text.trim()) return;
      const ind = Math.max(0, insIndent);
      setLines(lines.concat([{ id: uid(), text: text.trim(), indent: ind }]));
      const p = HW.parseLine(text);
      if (p && p.ctrl && !p.inline) setInsIndent(ind + 1);
    };
    const parseInfo = useMemo(() => lines.map(l => HW.describe(l.text)), [lines]);
    return html`<section class="editor" aria-label="알고리즘 편집기">
      <div class="ed-head">
        <h2>나의 알고리즘</h2>
        <div class="seg" role="tablist">
          <button role="tab" aria-selected=${mode === 'text'} class=${mode === 'text' ? 'on' : ''} onClick=${() => setMode('text')}>문장으로 쓰기</button>
          <button role="tab" aria-selected=${mode === 'block'} class=${mode === 'block' ? 'on' : ''} onClick=${() => setMode('block')}>블록으로 만들기</button>
        </div>
      </div>
      <ol class="lines" ref=${listRef}>
        ${lines.length === 0 ? html`<li class="empty-lines">아직 명령이 없어요. 학생들이 종이에 쓴 알고리즘을 한 줄씩 옮겨 적어 보세요.</li>` : null}
        ${lines.map((l, i) => {
          const info = parseInfo[i];
          const st = status.error === i ? 'err' : status.current === i ? 'cur' : status.done.has(i) ? 'done' : '';
          const cat = info ? CAT[info.cat] : null;
          return html`<li key=${l.id} data-ln=${i} class=${'ln ' + st} style=${{ '--ind': l.indent, '--cat': cat ? cat[1] : '#C5CBE6' }}>
            <span class="ln-no">${i + 1}</span>
            <div class="ln-body">
              ${l.indent ? html`<span class="ln-guides" aria-hidden="true">${Array.from({ length: l.indent }).map((_, k) => html`<i key=${k}/>`)}</span>` : null}
              <div class="ln-main">
                <input value=${l.text} disabled=${locked} aria-label=${`${i + 1}번째 명령`} onInput=${e => upd(i, { text: e.target.value })} onKeyDown=${e => { if (e.key === 'Enter') { e.preventDefault(); document.querySelector('.ed-new input')?.focus(); } }}/>
                ${info ? html`<span class=${'ln-tag' + (info.ok ? '' : ' bad')}><b>${cat[0]}</b>${info.label}</span>` : null}
              </div>
            </div>
            <span class="ln-tools">
              <button title="위로" aria-label="위로 옮기기" disabled=${locked || i === 0} onClick=${() => move(i, -1)}><${Icon} n="up"/></button>
              <button title="아래로" aria-label="아래로 옮기기" disabled=${locked || i === lines.length - 1} onClick=${() => move(i, 1)}><${Icon} n="down"/></button>
              <button title="내어쓰기" aria-label="내어쓰기" disabled=${locked || !l.indent} onClick=${() => upd(i, { indent: Math.max(0, l.indent - 1) })}><${Icon} n="left"/></button>
              <button title="들여쓰기 (반복·조건 안으로)" aria-label="들여쓰기" disabled=${locked || l.indent >= 4} onClick=${() => upd(i, { indent: l.indent + 1 })}><${Icon} n="right"/></button>
              <button title="삭제" aria-label="삭제" class="del" disabled=${locked} onClick=${() => del(i)}><${Icon} n="x"/></button>
            </span>
          </li>`;
        })}
      </ol>
      ${insIndent > 0 && !locked ? html`<div class="ins-note"><span>새 명령은 ${insIndent}칸 들여써서 반복·조건 <b>안에</b> 들어가요.</span><button onClick=${() => setInsIndent(Math.max(0, insIndent - 1))}>한 칸 밖으로</button></div>` : null}
      ${mode === 'text' ? html`<div class="ed-new">
          <input value=${draft} disabled=${locked} placeholder="예) 의자 위치를 확인한다" aria-label="새 명령 입력" onInput=${e => setDraft(e.target.value)} onKeyDown=${e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); add(draft); setDraft(''); } }}/>
          <button class="btn sm primary" disabled=${locked || !draft.trim()} onClick=${() => { add(draft); setDraft(''); }}><${Icon} n="plus"/>추가</button>
          <button class="btn sm ghost" disabled=${locked} onClick=${() => setBulk(lines.map(l => '  '.repeat(l.indent) + l.text).join('\n'))}>여러 줄 한꺼번에</button>
        </div>` : html`<${BlockPalette} mission=${mission} onAdd=${add} locked=${locked}/>`}
      ${bulk != null ? html`<div class="modal-back" onClick=${() => setBulk(null)}><div class="modal" onClick=${e => e.stopPropagation()} role="dialog" aria-label="여러 줄 입력">
          <h3>종이 알고리즘 한꺼번에 입력</h3>
          <p class="muted">한 줄에 명령 하나씩 쓰세요. 반복·조건 안에 들어갈 명령은 줄 앞에 띄어쓰기 두 칸(또는 &gt;)을 넣어요.</p>
          <textarea rows="12" value=${bulk} onInput=${e => setBulk(e.target.value)} placeholder=${'의자 위치를 확인한다\n3번 반복한다\n  앞으로 1칸 이동한다'}/>
          <div class="row end"><button class="btn ghost" onClick=${() => setBulk(null)}>취소</button><button class="btn primary" onClick=${() => { setLines(mkLines(bulk.split('\n').filter(t => t.trim()))); setBulk(null); setInsIndent(0); }}>이대로 바꾸기</button></div>
        </div></div>` : null}
    </section>`;
  }

  function BlockPalette({ mission, onAdd, locked }) {
    const nouns = Object.keys(mission.objs()).filter(k => mission.objs()[k].noun !== false && HW.NAME[k]);
    const items = nouns.filter(k => ['book', 'can', 'umbrella'].includes(k));
    const [cat, setCat] = useState('move');
    const [n, setN] = useState(1);
    const [dir, setDir] = useState('앞으로');
    const [obj, setObj] = useState(nouns[0] || '');
    const [item, setItem] = useState(items[0] || '');
    const [rep, setRep] = useState(3);
    const N = k => HW.NAME[k];
    const goal = mission.map.some(r => r.includes('T')) ? '보물' : mission.map.some(r => r.includes('G')) ? '중앙현관' : '별';
    const cats = [['move', '이동하기'], ['turn', '방향 바꾸기'], ['check', '물건 확인하기'], ['pick', '물건 잡기'], ['put', '물건 놓기'], ['sit', '앉기'], ['stand', '일어서기'], ['rep', '반복하기'], ['sel', '조건에 따라']];
    const Sel = ({ v, set, opts }) => html`<select value=${v} onChange=${e => set(e.target.value)} disabled=${locked}>${opts.map(o => html`<option key=${o[0]} value=${o[0]}>${o[1]}</option>`)}</select>`;
    const B = (text) => html`<button class="blk" disabled=${locked} onClick=${() => onAdd(text)}>${text}</button>`;
    const numOpts = Array.from({ length: 12 }).map((_, i) => [i + 1, i + 1]);
    const objOpts = nouns.map(k => [k, N(k)]);
    let body;
    if (cat === 'move') body = html`<div class="blk-row"><${Sel} v=${dir} set=${setDir} opts=${[['앞으로', '앞으로'], ['뒤로', '뒤로']]}/><${Sel} v=${n} set=${setN} opts=${numOpts}/><span>칸</span>${B(`${dir} ${n}칸 이동한다`)}</div>
      ${mission.allowGoto && nouns.length ? html`<div class="blk-row"><${Sel} v=${obj} set=${setObj} opts=${objOpts}/>${B(`${obj && N(obj)} 앞까지 이동한다`)}</div>` : html`<p class="muted small">이 미션에서는 "~까지 이동"을 쓸 수 없어요.</p>`}`;
    else if (cat === 'turn') body = html`<div class="blk-row">${B('오른쪽으로 돈다')}${B('왼쪽으로 돈다')}${B('뒤로 돈다')}</div>`;
    else if (cat === 'check') body = html`<div class="blk-row">${nouns.length ? html`<${Sel} v=${obj} set=${setObj} opts=${objOpts}/>` : null}${nouns.length ? B(`${obj && N(obj)} 위치를 확인한다`) : null}${B('앞을 확인한다')}</div>${nouns.includes('chair') ? html`<div class="blk-row">${B('의자 방향을 확인한다')}</div>` : null}`;
    else if (cat === 'pick') body = html`<div class="blk-row">${items.map(k => html`<span key=${k}>${B(eul(N(k)) + ' 집는다')}</span>`)}${nouns.includes('chair') ? B('의자를 뒤로 당긴다') : null}${nouns.includes('bag') ? B('가방을 연다') : null}${nouns.includes('sink') ? B('물뿌리개에 물을 담는다') : null}${!items.length && !nouns.includes('chair') ? html`<p class="muted small">이 미션에는 잡을 물건이 없어요.</p>` : null}</div>`;
    else if (cat === 'put') body = html`<div class="blk-row">${nouns.includes('bag') ? B('책을 가방에 넣는다') : null}${nouns.includes('bag') ? B('가방을 닫는다') : null}${nouns.includes('plant') ? html`<span class="inline">화분에 물을 <${Sel} v=${rep} set=${setRep} opts=${numOpts.slice(0, 5)}/>번 ${B(`화분에 물을 ${rep}번 준다`)}</span>` : null}${nouns.includes('friend') ? B('우산을 친구에게 준다') : null}${items.length ? html`<${Sel} v=${item} set=${setItem} opts=${items.map(k => [k, N(k)])}/>` : null}${items.length ? B(`${eul(N(item || items[0]))} 내려놓는다`) : null}${!items.length ? html`<p class="muted small">이 미션에는 놓을 물건이 없어요.</p>` : null}</div>`;
    else if (cat === 'sit') body = html`<div class="blk-row">${B('무릎을 굽힌다')}${B('의자에 앉는다')}</div>`;
    else if (cat === 'stand') body = html`<div class="blk-row">${B('무릎을 편다')}${B('일어선다')}</div>`;
    else if (cat === 'rep') body = html`<div class="blk-row"><${Sel} v=${rep} set=${setRep} opts=${numOpts}/><span>번</span>${B(`${rep}번 반복한다`)}</div><div class="blk-row">${B('앞에 벽이 없는 동안 반복한다')}${B('앞에 벽이 있을 때까지 반복한다')}${B(`${goal}에 도착할 때까지 반복한다`)}</div><p class="muted small">반복 블록을 넣으면 다음 명령이 자동으로 그 안(들여쓰기)에 들어가요.</p>`;
    else if (cat === 'sel') body = html`<div class="blk-row">${B('만약 비가 온다면')}${B('만약 앞에 벽이 있다면')}${B('만약 앞에 벽이 없다면')}${B('아니라면')}</div><p class="muted small">"아니라면"은 "만약" 블록과 같은 들여쓰기에 놓아요.</p>`;
    return html`<div class="palette">
      <div class="pal-cats">${cats.map(([k, t]) => html`<button key=${k} class=${cat === k ? 'on' : ''} onClick=${() => setCat(k)} data-cat=${k}>${t}</button>`)}</div>
      <div class="pal-body">${Array.isArray(body) ? body.map((b, i) => b && typeof b === 'object' ? React.cloneElement(b, { key: i }) : b) : body}</div>
    </div>`;
  }

  /* ===================== 결과 패널 ===================== */
  function ResultPanel({ mission, result, score, newBadges, onClose, onReplay, onNext, record, fails, onAnswer }) {
    const [more, setMore] = useState(false);
    if (result.success) {
      const s = score || { acc: 0, spec: 0, eff: 0, stars: 0 };
      const st = result.metrics.structs;
      return html`<div class="result win" role="status">
        <div class="res-top"><div><p class="res-kicker">미션 성공</p><h3>현우가 해냈어요!</h3></div>${score ? html`<div class="stars" aria-label=${`별 ${s.stars}개`}>${[1, 2, 3].map(i => html`<span key=${i} class=${i <= s.stars ? 'on' : ''}>★</span>`)}</div>` : null}</div>
        <p class="res-say">현우: “${mission.id === 1 ? '진짜 앉혔네! 생각보다 자세하게 말해야 했지?' : '완벽해! 네가 말한 그대로 했더니 성공이야!'}”</p>
        ${score ? html`<div class="scores">
          ${[['정확성', s.acc, `${record.solvedAt}번째 도전에서 성공`], ['구체성', s.spec, record.ambErrs ? `모호한 명령 ${record.ambErrs}번` : '모호한 명령 없음'], ['효율성', s.eff, `명령 ${result.metrics.lines}줄 · 기준 ${mission.par}줄`]].map(([k, v, d]) => html`<div key=${k} class="score"><b>${k}</b><span class="meter">${[1, 2, 3].map(i => html`<i key=${i} class=${i <= v ? 'on' : ''}/>`)}</span><small>${d}</small></div>`)}
        </div>` : null}
        <p class="muted small">사용한 구조: 순차${st.rep ? ' · 반복' : ''}${st.sel ? ' · 선택' : ''} · 실제 실행 동작 ${result.metrics.steps}번${result.alt ? ` · ${result.alt.weather === 'rain' ? '비 오는 날' : '맑은 날'}에도 성공` : ''}</p>
        ${newBadges && newBadges.length ? html`<div class="badges">${newBadges.map(b => html`<span key=${b} class="badge" title=${BADGE_INFO[b]}>${b}</span>`)}</div>` : null}
        <div class="row"><button class="btn ghost sm" onClick=${onReplay}><${Icon} n="replay"/>성공 장면 다시 보기</button>${onNext ? html`<button class="btn primary sm" onClick=${onNext}>다음 미션</button>` : null}<button class="btn ghost sm" onClick=${onClose}>닫기</button></div>
        ${score && s.eff < 3 ? html`<p class="challenge">더 효율적인 알고리즘 도전: 같은 결과를 더 적은 줄로 만들 수 있을까요?</p>` : null}
      </div>`;
    }
    const e = result.err || {};
    return html`<div class="result lose" role="alert">
      <div class="res-cols"><div>
      <p class="res-kicker">[알고리즘 실행 중단]</p>
      <h3>${e.title || '실패'}</h3>
      <p class="res-say">현우: “${e.say}”</p>
      </div><div>
      <div class="res-block"><b>[오류 분석]</b><p>${result.line != null ? `${result.line + 1}번째 명령에서 문제가 발생했습니다.` : '알고리즘은 끝까지 실행되었지만 미션 조건을 만족하지 못했습니다.'}</p></div>
      <div class="res-block q"><b>[왜 실패했을까요?]</b><p>${e.question}</p></div>
      ${more ? html`<div class="res-block"><b>[자세한 설명]</b><p>${e.detail}</p>${e.examples ? html`<ul class="ex">${e.examples.map(x => html`<li key=${x}>${x}</li>`)}</ul>` : null}</div>` : html`<button class="link" onClick=${() => setMore(true)}>스스로 생각해 본 뒤 자세한 설명 보기</button>`}</div></div>
      <div class="row"><button class="btn ghost sm" onClick=${onReplay}><${Icon} n="replay"/>실패 장면 다시 보기</button>${fails >= 4 && onAnswer ? html`<button class="btn ghost sm" onClick=${onAnswer}>정답 보기</button>` : null}<button class="btn primary sm" onClick=${onClose}>알고리즘 고치기</button></div>
    </div>`;
  }

  /* ===================== 플레이 화면 ===================== */
  const DUR = { start: 700, walk: 430, turn: 420, act: 950, check: 1500, cond: 900, bump: 900, say: 1100, confused: 900, fail: 1100, end: 1200, win: 1400 };

  function Play({ mission, records, setRecords, saves, setSaves, onHome, onNext, settings, setSettings, lab }) {
    const key = 'prog-' + mission.id;
    const [lines, setLinesRaw] = useState(() => mkLines((store.get(key, null) || []).map(l => '>'.repeat(l.indent) + l.text)));
    const [insIndent, setInsIndent] = useState(0);
    const [weather, setWeather] = useState('rain');
    const [runData, setRunData] = useState(null);
    const [idx, setIdx] = useState(0);
    const [playing, setPlaying] = useState(false);
    const [stopAt, setStopAt] = useState(null);
    const [finished, setFinished] = useState(false);
    const [panel, setPanel] = useState(null);
    const [hints, setHints] = useState(0);
    const [saveName, setSaveName] = useState(null);
    const [fails, setFails] = useState(0);
    const [showAns, setShowAns] = useState(false);
    const [armClear, setArmClear] = useState(false);
    useEffect(() => { if (!armClear) return; const t = setTimeout(() => setArmClear(false), 3000); return () => clearTimeout(t); }, [armClear]);
    const [present, setPresent] = useState(false);
    const [infoOpen, setInfoOpen] = useState(() => typeof window === 'undefined' || window.innerWidth > 1100);
    const recorded = useRef(false);
    const lastPanel = useRef(null);
    const speed = settings.speed;

    const setLines = useCallback(ls => { setLinesRaw(ls); store.set(key, plain(ls)); if (runData) { setRunData(null); setPlaying(false); setFinished(false); setPanel(null); } }, [runData, key]);
    useEffect(() => { if (lab && lab.preset) { setLinesRaw(mkLines(lab.preset.lines)); store.set(key, plain(mkLines(lab.preset.lines))); setRunData(null); setPanel(null); if (lab.preset.weather) setWeather(lab.preset.weather); } }, [lab && lab.preset]);

    const idle = useMemo(() => HW.run(mission, [], { weather }).frames[0], [mission, weather]);
    const frames = runData ? runData.frames : null;
    const frame = frames ? frames[Math.min(idx, frames.length - 1)] : idle;
    const locked = !!runData && !finished && (playing || idx > 0);

    const start = (stepMode) => {
      const r = HW.run(mission, lines, { weather });
      setFails(f => r.result.success ? 0 : f + 1);
      recorded.current = false; lastPanel.current = null;
      setRunData(r); setIdx(0); setFinished(false); setPanel(null);
      setStopAt(stepMode ? 0 : null); setPlaying(!stepMode);
    };
    const groupEnd = (fr, from) => { let j = from; if (j >= fr.length) return fr.length - 1; const L = fr[j].line; if (fr[j].kind === 'cond' || L == null) return j; while (j + 1 < fr.length && fr[j + 1].line === L && fr[j + 1].kind !== 'cond') j++; return j; };
    const finish = useCallback(() => {
      setFinished(true); setPlaying(false);
      if (!recorded.current && runData && !lab) {
        recorded.current = true;
        const out = recordRun(records, mission, runData.result, lines);
        setRecords(out.records);
        lastPanel.current = { score: out.score, newBadges: out.newBadges };
        setPanel(lastPanel.current);
      } else setPanel(lastPanel.current || { score: null, newBadges: [] });
    }, [runData, records, lines, mission, lab]);

    useEffect(() => {
      if (!playing || !frames) return;
      if (idx >= frames.length - 1) { finish(); return; }
      if (stopAt != null && idx >= stopAt) { setPlaying(false); return; }
      const f = frames[idx];
      const t = setTimeout(() => setIdx(i => i + 1), (DUR[f.kind] || 700) / speed);
      return () => clearTimeout(t);
    }, [playing, idx, frames, stopAt, speed, finish]);

    const onRun = () => { if (runData && !finished && !playing) { setStopAt(null); setPlaying(true); } else start(false); };
    const onStep = () => {
      if (!runData || finished) { start(true); return; }
      if (idx >= frames.length - 1) { finish(); return; }
      const end = groupEnd(frames, idx + 1);
      setStopAt(end); setPlaying(true);
    };
    const onPause = () => setPlaying(false);
    const onReset = () => { setRunData(null); setIdx(0); setPlaying(false); setFinished(false); setPanel(null); };
    const onReplay = () => { if (!runData) return; setPanel(null); setFinished(false); setIdx(0); setStopAt(null); setPlaying(true); recorded.current = true; };
    useEffect(() => { const h = e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); onRun(); } }; window.addEventListener('keydown', h); return () => window.removeEventListener('keydown', h); });

    const status = useMemo(() => {
      const done = new Set();
      if (frames) for (let i = 0; i <= Math.min(idx, frames.length - 1); i++) if (frames[i].line != null) done.add(frames[i].line);
      const cur = frames && !finished ? frame.line : null;
      if (cur != null) done.delete(cur);
      const error = finished && runData && !runData.result.success ? runData.result.line : (frame.fail ? frame.line : null);
      return { done, current: cur, error };
    }, [frames, idx, finished, frame]);

    const fullscreen = () => {
      const el = document.documentElement;
      if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().then(() => setPresent(true)).catch(() => setPresent(p => !p));
      else if (document.fullscreenElement) { document.exitFullscreen(); setPresent(false); }
      else setPresent(p => !p);
    };
    useEffect(() => { const h = () => { if (!document.fullscreenElement) setPresent(false); }; document.addEventListener('fullscreenchange', h); return () => document.removeEventListener('fullscreenchange', h); }, []);

    const rec = records[mission.id] || {};
    const mySaves = saves.filter(s => s.mission === mission.id);
    const doSave = () => { const name = (saveName || '').trim() || `알고리즘 ${mySaves.length + 1}`; setSaves(saves.concat([{ id: uid(), mission: mission.id, name, lines: plain(lines), at: Date.now() }])); setSaveName(null); };
    const condBanner = frame.kind === 'cond' ? frame.say : null;
    const bubble = frame.kind === 'cond' ? null : frame.say;

    return html`<div class=${'play' + (present ? ' presenting' : '') + (infoOpen ? '' : ' info-closed')}>
      <aside class="mission-info">
        <button class="info-toggle" onClick=${() => setInfoOpen(o => !o)} aria-expanded=${infoOpen}>${infoOpen ? '미션 정보 접기' : '미션 정보'}</button>
        ${lab ? lab.panel : html`<div class="mi-inner">
          <p class="mi-no">미션 ${mission.id} <span class="lvl" aria-label=${`난이도 ${mission.level}`}>${'★'.repeat(mission.level)}<i>${'★'.repeat(3 - mission.level)}</i></span></p>
          <h2>${mission.title}</h2>
          <p class="mi-goal">${mission.goal}</p>
          <h4>성공 조건</h4>
          <ul class="ticks">${mission.success.map(s => html`<li key=${s}>${s}</li>`)}</ul>
          <h4>현우의 규칙</h4>
          <ul class="rules">${mission.rules.map(s => html`<li key=${s}>${s}</li>`)}</ul>
          <div class="hints">
            <h4>힌트 <small>${hints}/3</small></h4>
            ${HINTS[mission.id].slice(0, hints).map((h, i) => html`<p key=${i} class="hint"><b>${i + 1}</b>${h}</p>`)}
            ${hints < 3 ? html`<button class="btn ghost sm" onClick=${() => setHints(hints + 1)}>${hints ? '다음 힌트 보기' : '힌트 보기'}</button>` : html`<p class="muted small">힌트는 여기까지! 정답은 스스로 찾아보세요.</p>`}
          </div>
          ${fails >= 4 && mission.answer ? html`<div class="ans-offer"><p>4번 실패했어요. 막힌 곳을 한 번 더 생각해 보고, 정말 어려우면 정답을 확인해 보세요.</p><button class="btn primary sm" onClick=${() => setShowAns(true)}>정답 보기</button></div>` : null}
          <div class="mi-rec"><span>도전 ${rec.attempts || 0}번</span><span>실패 ${rec.fails || 0}번</span>${rec.solved ? html`<span class="ok">해결함</span>` : null}</div>
        </div>`}
      </aside>

      <section class="sim">
        <div class="sim-bar">
          <span class="view-label">${mission.view}</span>
          ${mission.dual || (lab && lab.weather) ? html`<div class="seg weather" role="group" aria-label="날씨">
              <button class=${weather === 'rain' ? 'on' : ''} disabled=${locked} onClick=${() => { setWeather('rain'); onReset(); }}>☔ 비 오는 날</button>
              <button class=${weather === 'sun' ? 'on' : ''} disabled=${locked} onClick=${() => { setWeather('sun'); onReset(); }}>☀️ 맑은 날</button>
            </div>` : null}
          <span class="hero-state">현우: ${HW.SCREEN[frame.s.hero.dir]} 바라봄 · ${{ stand: '서 있음', bend: '무릎 굽힘', sit: '앉아 있음', fall: '넘어짐' }[frame.s.hero.pose]}${frame.s.hero.holding ? ` · ${HW.NAME[frame.s.hero.holding]} 들고 있음` : ''}</span>
        </div>
        <div class="stage-wrap">
          <${Stage} mission=${mission} frame=${frame} speed=${speed} playing=${playing} bubble=${bubble} win=${finished && runData && runData.result.success} present=${present}/>
          ${condBanner ? html`<div class="cond-banner">${condBanner}</div>` : null}
          ${frame.line != null && !finished && runData ? html`<div class="now-line"><b>${frame.line + 1}번</b> ${lines[frame.line] ? lines[frame.line].text : ''}</div>` : null}
        </div>
        <div class="controls">
          <button class="btn run" onClick=${onRun} disabled=${playing}><${Icon} n="play"/>${runData && !finished && idx > 0 ? '이어서 실행' : '실행'}</button>
          <button class="btn ghost" onClick=${onStep} disabled=${playing}><${Icon} n="step"/>한 단계씩</button>
          <button class="btn ghost" onClick=${onPause} disabled=${!playing}><${Icon} n="pause"/>일시정지</button>
          <button class="btn ghost" onClick=${onReset} disabled=${!runData}><${Icon} n="reset"/>처음으로</button>
          <label class="speed"><span class="sp-l">속도</span><input type="range" min="0.5" max="2.5" step="0.25" value=${speed} onInput=${e => setSettings(Object.assign({}, settings, { speed: +e.target.value }))}/><span>${speed}x</span></label>
          <button class="btn ghost icon" title="전체화면" aria-label="전체화면" onClick=${fullscreen}><${Icon} n="full"/></button>
        </div>
          ${panel && runData ? html`<${ResultPanel} mission=${mission} result=${runData.result} score=${panel.score} newBadges=${panel.newBadges} record=${records[mission.id] || {}} onClose=${() => setPanel(null)} onReplay=${onReplay} onNext=${runData.result.success && onNext ? onNext : null} fails=${fails} onAnswer=${mission.answer ? () => setShowAns(true) : null}/>` : null}

      </section>

      ${showAns && mission.answer ? html`<div class="modal-back" onClick=${() => setShowAns(false)}><div class="modal" onClick=${e => e.stopPropagation()} role="dialog" aria-label="정답 알고리즘">
          <h3>정답 알고리즘 · 미션 ${mission.id}</h3>
          <p class="muted">한 가지 정답이에요. 먼저 왜 이 순서여야 하는지 이야기해 보고, 다른 방법도 있는지 찾아보세요.</p>
          <ol class="ans">${mission.answer.map((t, i) => { const ind = (t.match(/^>*/)||[''])[0].length; return html`<li key=${i} style=${{ paddingLeft: (ind * 18) + 'px' }}>${t.replace(/^>+/, '')}</li>`; })}</ol>
          <div class="row end"><button class="btn ghost" onClick=${() => setShowAns(false)}>닫기</button><button class="btn primary" onClick=${() => { setLines(mkLines(mission.answer)); setInsIndent(0); setShowAns(false); }}>이 알고리즘 불러오기</button></div>
        </div></div>` : null}
      <div class="ed-col">
        <${Editor} mission=${mission} lines=${lines} setLines=${setLines} status=${status} locked=${locked} insIndent=${insIndent} setInsIndent=${setInsIndent}/>
        <div class="ed-foot">
          <button class=${'btn sm ' + (armClear ? 'wrong' : 'ghost')} disabled=${!lines.length} onClick=${() => { if (!armClear) { setArmClear(true); return; } setLines([]); setInsIndent(0); setArmClear(false); }}>${armClear ? '정말 지울까요?' : '모두 지우기'}</button>
          ${!lab ? html`<${React.Fragment}>${saveName == null ? html`<button class="btn ghost sm" disabled=${!lines.length} onClick=${() => setSaveName('')}>저장</button>` : html`<span class="save-in"><input autoFocus placeholder="예) 3모둠" value=${saveName} onInput=${e => setSaveName(e.target.value)} onKeyDown=${e => e.key === 'Enter' && doSave()}/><button class="btn primary sm" onClick=${doSave}>저장</button></span>`}
          ${mySaves.length ? html`<select class="load" value="" disabled=${locked} onChange=${e => { const s = mySaves.find(x => x.id === e.target.value); if (s) { setLines(mkLines(s.lines.map(l => '>'.repeat(l.indent) + l.text))); setInsIndent(0); } }}><option value="">불러오기…</option>${mySaves.map(s => html`<option key=${s.id} value=${s.id}>${s.name}</option>`)}</select>` : null}<//>` : null}
        </div>
      </div>
    </div>`;
  }

  /* ===================== 비교 화면 ===================== */
  function Compare({ mission, entries, onClose, onLoad }) {
    const [a, setA] = useState(entries[0] ? entries[0].id : '');
    const [b, setB] = useState(entries[1] ? entries[1].id : '');
    const [w, setW] = useState('rain');
    const col = id => {
      const e = entries.find(x => x.id === id); if (!e) return html`<div class="cmp-col empty">비교할 알고리즘을 고르세요.</div>`;
      const r = HW.run(mission, e.lines, { weather: w }).result;
      return html`<div class="cmp-col">
        <div class=${'cmp-res ' + (r.success ? 'ok' : 'no')}>${r.success ? '성공' : `실패: ${r.err ? r.err.title : ''}`}${r.line != null ? ` (${r.line + 1}번째 명령)` : ''}</div>
        <ol class="cmp-lines">${e.lines.map((l, i) => html`<li key=${i} class=${r.line === i ? 'err' : ''} style=${{ paddingLeft: (l.indent * 18 + 8) + 'px' }}>${l.text}</li>`)}</ol>
        <dl class="cmp-m"><div><dt>명령 줄 수</dt><dd>${r.metrics.lines}</dd></div><div><dt>실행 동작 수</dt><dd>${r.metrics.steps}</dd></div><div><dt>사용 구조</dt><dd>순차${r.metrics.structs.rep ? '·반복' : ''}${r.metrics.structs.sel ? '·선택' : ''}</dd></div></dl>

    return html`<div class="modal-back" onClick=${onClose}><div class="modal wide" onClick=${e => e.stopPropagation()} role="dialog" aria-label="알고리즘 비교">
      <div class="row between"><h3>알고리즘 비교 · 미션 ${mission.id}</h3><button class="btn ghost sm" onClick=${onClose}>닫기</button></div>
      ${mission.dual ? html`<div class="seg"><button class=${w === 'rain' ? 'on' : ''} onClick=${() => setW('rain')}>☔ 비 오는 날</button><button class=${w === 'sun' ? 'on' : ''} onClick=${() => setW('sun')}>☀️ 맑은 날</button></div>` : null}
      <div class="cmp">
        <div><select value=${a} onChange=${e => setA(e.target.value)}><option value="">선택</option>${entries.map(x => html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select>${col(a)}</div>
        <div><select value=${b} onChange=${e => setB(e.target.value)}><option value="">선택</option>${entries.map(x => html`<option key=${x.id} value=${x.id}>${x.name}</option>`)}</select>${col(b)}</div>
      </div>
    </div></div>`;
  }

  /* ===================== 홈 ===================== */

          <svg viewBox="-10 -60 260 240">

            <g transform="translate(20 -40) scale(2.45)"><${HeroSprite} dir="S" mood="happy" pose="stand" holding=${null}/></g>

              <span class="m-no">${m.id}</span>

              <span class="m-side"><span class="lvl">${'★'.repeat(m.level)}<i>${'★'.repeat(3 - m.level)}</i></span><span class="m-st">${r && r.solved ? `획득 별 ${s}/3` : r && r.attempts ? `도전 ${r.attempts}번` : '도전 전'}</span></span>
            </button></li>`; })}</ol>
        </div>
        <div class="side-col">
          <div class="panel record">
            <h2>나의 도전 기록</h2>

            <button class="btn ghost sm" onClick=${() => go('records')}>기록과 알고리즘 비교 보기</button>

  /* ===================== 기록 화면 ===================== */
  function Records({ records, saves, setSaves, setRecords, go }) {
    const [cmp, setCmp] = useState(null);
    const [armReset, setArmReset] = useState(false);
    useEffect(() => { if (!armReset) return; const t = setTimeout(() => setArmReset(false), 3000); return () => clearTimeout(t); }, [armReset]);
    const entriesFor = m => {
      const r = records[m.id] || {};
      const e = saves.filter(s => s.mission === m.id).map(s => ({ id: s.id, name: s.name, lines: s.lines }));
      if (r.lastSuccess) e.push({ id: 'ls' + m.id, name: '최근 성공 알고리즘', lines: r.lastSuccess.program });
      if (r.lastFail) e.push({ id: 'lf' + m.id, name: '최근 실패 알고리즘', lines: r.lastFail.program });
      if (r.best) e.push({ id: 'bs' + m.id, name: '최고 기록 알고리즘', lines: r.best.program });
      return e;
    };
    return html`<main class="records">
      <div class="row between"><h1 class="page-title">도전 기록</h1><button class=${'btn sm ' + (armReset ? 'wrong' : 'ghost')} onClick=${() => { if (!armReset) { setArmReset(true); return; } setRecords({}); setArmReset(false); }}>${armReset ? '정말 초기화할까요? (저장 알고리즘은 남아요)' : '기록 초기화'}</button></div>
      <p class="muted">별은 정확성(몇 번째 도전에 성공했나), 구체성(모호한 명령을 얼마나 줄였나), 효율성(기준 줄 수와 비교)을 함께 보고 매겨요. 명령이 짧다고 무조건 좋은 알고리즘은 아니에요.</p>
      <div class="rec-table" role="table">
        <div class="rt-row head" role="row"><span>미션</span><span>결과</span><span>도전</span><span>실패</span><span>모호한 명령</span><span>최고 기록</span><span>사용 구조</span><span>배지</span><span></span></div>
        ${HW.MISSIONS.map(m => { const r = records[m.id] || {}; const b = r.best; return html`<div key=${m.id} class="rt-row" role="row">
            <span><b>${m.id}.</b> ${m.title}</span>
            <span>${r.solved ? html`<em class="ok">성공 ${'★'.repeat(b ? b.score.stars : 1)}</em>` : r.attempts ? '도전 중' : '-'}</span>
            <span>${r.attempts || 0}</span><span>${r.fails || 0}</span><span>${r.ambErrs || 0}</span>
            <span>${b ? `${b.lines}줄 · 동작 ${b.steps}번 · ${r.solvedAt}번째 도전` : '-'}</span>
            <span>${b ? `순차${b.structs.rep ? '·반복' : ''}${b.structs.sel ? '·선택' : ''}` : '-'}</span>
            <span class="bdg">${(r.badges || []).map(x => html`<i key=${x} title=${BADGE_INFO[x]}>${x}</i>`)}</span>
            <span><button class="btn ghost sm" disabled=${entriesFor(m).length < 1} onClick=${() => setCmp(m)}>비교</button></span>
          </div>`; })}
      </div>
      <h2 class="sec">저장한 알고리즘</h2>
      ${saves.length ? html`<ul class="save-list">${saves.map(s => html`<li key=${s.id}><span><b>${s.name}</b> · 미션 ${s.mission} · ${s.lines.length}줄</span><span class="row"><button class="btn ghost sm" onClick=${() => { store.set('prog-' + s.mission, s.lines); go('play', s.mission); }}>열기</button><button class="btn ghost sm" onClick=${() => setSaves(saves.filter(x => x.id !== s.id))}>삭제</button></span></li>`)}</ul>` : html`<p class="muted">아직 저장한 알고리즘이 없어요. 미션 화면 아래쪽 '저장' 버튼으로 모둠별 알고리즘을 저장해 두면 여기서 비교할 수 있어요.</p>`}
      ${cmp ? html`<${Compare} mission=${cmp} entries=${entriesFor(cmp)} onClose=${() => setCmp(null)} onLoad=${e => { store.set('prog-' + cmp.id, e.lines); go('play', cmp.id); }}/>` : null}
    </main>`;
  }

  /* ===================== 구조 연구소 ===================== */
  const LAB_TABS = {
    seq: { name: '순차', color: 'c-seq', text: '명령을 위에서 아래로 차례대로 실행해요. 순서가 바뀌면 결과도 달라져요.', presets: [{ label: '올바른 순서', lines: ['앞으로 6칸 이동한다', '오른쪽으로 돈다', '앞으로 4칸 이동한다'] }, { label: '순서를 바꾸면?', lines: ['오른쪽으로 돈다', '앞으로 6칸 이동한다', '앞으로 4칸 이동한다'] }], q: '두 알고리즘은 명령이 똑같아요. 그런데 왜 결과가 다를까요?' },
    sel: { name: '선택', color: 'c-sel', weather: true, text: '조건에 따라 서로 다른 명령을 실행해요. 날씨를 바꿔 가며 실행해 보세요.', presets: [{ label: '날씨에 따라 다른 길', lines: ['만약 비가 온다면', '>앞으로 6칸 이동한다', '>오른쪽으로 돈다', '>앞으로 4칸 이동한다', '아니라면', '>오른쪽으로 돈다', '>앞으로 4칸 이동한다', '>왼쪽으로 돈다', '>앞으로 6칸 이동한다'] }, { label: '조건 없이 쓰면?', lines: ['앞으로 6칸 이동한다', '오른쪽으로 돈다', '앞으로 4칸 이동한다', '오른쪽으로 돈다', '앞으로 4칸 이동한다'] }], q: '비 오는 날과 맑은 날, 현우는 같은 길로 갔나요?' },
    rep: { name: '반복', color: 'c-rep', text: '같은 명령을 정해진 횟수만큼, 또는 조건이 맞을 때까지 되풀이해요.', presets: [{ label: '반복 없이', lines: ['앞으로 1칸 이동한다', '앞으로 1칸 이동한다', '앞으로 1칸 이동한다', '앞으로 1칸 이동한다', '앞으로 1칸 이동한다', '앞으로 1칸 이동한다', '오른쪽으로 돈다', '앞으로 1칸 이동한다', '앞으로 1칸 이동한다', '앞으로 1칸 이동한다', '앞으로 1칸 이동한다'] }, { label: '횟수 반복', lines: ['6번 반복한다', '>앞으로 1칸 이동한다', '오른쪽으로 돈다', '4번 반복한다', '>앞으로 1칸 이동한다'] }, { label: '조건 반복', lines: ['앞에 벽이 없는 동안 반복한다', '>앞으로 1칸 이동한다', '오른쪽으로 돈다', '별에 도착할 때까지 반복한다', '>앞으로 1칸 이동한다'] }], q: '세 알고리즘의 줄 수와 실제로 움직인 횟수를 비교해 보세요.' },
  };
  const QUIZ = [['내 나이만큼 제자리에서 깡총깡총 뛴다.', 'rep'], ['의자에 바르게 앉았다가 책상을 짚고 일어난 후 기지개를 켠다.', 'seq'], ['내 번호가 짝수라면 왼손을, 홀수라면 오른손을 든다.', 'sel'], ['오늘 기분이 좋다면 손목을 돌리고, 아니라면 발목을 돌린다.', 'sel'], ['의자를 빼고 일어난 후, 왼쪽을 바라보고 인사한다.', 'seq'], ['“우리반 최고야!”라고 세 번 말한다.', 'rep']];
  function Lab(props) {
    const [tab, setTab] = useState('seq');
    const [preset, setPreset] = useState(() => Object.assign({ weather: 'rain' }, LAB_TABS.seq.presets[0]));
    const [qi, setQi] = useState(0);
    const [ans, setAns] = useState(null);
    const T = LAB_TABS[tab];
    const panel = html`<div class="mi-inner lab-panel">
      <h2>알고리즘 구조 연구소</h2>
      <div class="seg wide" role="tablist">${Object.keys(LAB_TABS).map(k => html`<button key=${k} role="tab" aria-selected=${tab === k} class=${tab === k ? 'on' : ''} onClick=${() => { setTab(k); setPreset(Object.assign({ weather: 'rain' }, LAB_TABS[k].presets[0])); }}>${LAB_TABS[k].name}</button>`)}</div>
      <p class="lab-def"><i class=${T.color}></i>${T.text}</p>
      <h4>알고리즘 불러와서 비교하기</h4>
      <div class="col-btns">${T.presets.map((p, i) => html`<button key=${i} class=${'btn ghost sm' + (preset && preset.label === p.label ? ' active' : '')} onClick=${() => setPreset(Object.assign({ weather: 'rain', n: Date.now() }, p))}>${String.fromCharCode(65 + i)}. ${p.label}</button>`)}</div>
      <p class="hint"><b>?</b>${T.q}</p>
      <p class="muted small">불러온 알고리즘을 직접 고쳐서 실행해 보세요. 목표는 노란 별 칸이에요.</p>
      <div class="quiz">
        <h4>구조 맞히기 <small>${qi + 1}/${QUIZ.length}</small></h4>
        <p class="qz">${QUIZ[qi][0]}</p>
        <div class="row">${[['seq', '순차'], ['rep', '반복'], ['sel', '선택']].map(([k, t]) => html`<button key=${k} class=${'btn sm ' + (ans ? (k === QUIZ[qi][1] ? 'right' : ans === k ? 'wrong' : 'ghost') : 'ghost')} disabled=${!!ans} onClick=${() => setAns(k)}>${t}</button>`)}</div>
        ${ans ? html`<p class=${'qz-fb ' + (ans === QUIZ[qi][1] ? 'ok' : 'no')}>${ans === QUIZ[qi][1] ? '정답!' : '다시 생각해 볼까요?'} ${{ seq: '순서대로 차례차례 하는 일이라 순차 구조예요.', rep: '같은 행동을 여러 번 되풀이하니까 반복 구조예요.', sel: '조건에 따라 하는 일이 달라지니까 선택 구조예요.' }[QUIZ[qi][1]]}</p><button class="btn ghost sm" onClick=${() => { setQi((qi + 1) % QUIZ.length); setAns(null); }}>다음 문제</button>` : null}
      </div>
    </div>`;
    return html`<${Play} key="lab" ...${props} mission=${HW.LAB} lab=${{ panel, preset, weather: !!T.weather }}/>`;
  }

  /* ===================== 사용 방법 ===================== */
  function Guide({ go }) {
    return html`<main class="guide">
      <h1 class="page-title">사용 방법</h1>
      <div class="guide-grid">
        <section class="panel"><h2>수업 흐름</h2><ol class="steps"><li>학생들이 종이에 알고리즘을 써요.</li><li>선생님이 오른쪽 편집기에 한 줄씩 옮겨 적어요. "여러 줄 한꺼번에"로 붙여 넣어도 돼요.</li><li><b>실행</b> 또는 <b>한 단계씩</b>으로 현우가 움직이는 모습을 함께 봐요.</li><li>실패하면 질문을 읽고, 어디를 고쳐야 할지 학생들이 먼저 이야기해요.</li><li>모둠별 알고리즘을 저장해 두었다가 기록 화면에서 나란히 비교해요.</li></ol></section>
        <section class="panel"><h2>현우가 알아듣는 말</h2><ul class="cmds"><li><b>이동</b> 앞으로 3칸 이동한다 · 뒤로 1칸 이동한다 · 의자 앞까지 이동한다</li><li><b>방향</b> 오른쪽으로 돈다 · 왼쪽으로 돈다 · 뒤로 돈다 · 화분을 바라본다</li><li><b>확인</b> 의자 위치를 확인한다 · 의자 방향을 확인한다 · 앞을 확인한다</li><li><b>물건</b> 책을 집는다 · 가방을 연다/닫는다 · 책을 가방에 넣는다 · 의자를 당긴다 · 물을 담는다 · 화분에 물을 2번 준다 · 우산을 친구에게 준다 · 우산을 내려놓는다</li><li><b>자세</b> 무릎을 굽힌다 · 의자에 앉는다 · 일어선다</li><li><b>반복</b> 3번 반복한다 · 앞에 벽이 없는 동안 반복한다 · 보물에 도착할 때까지 반복한다 · 앞으로 1칸 이동을 4번 반복한다</li><li><b>선택</b> 만약 비가 온다면 · 만약 앞에 벽이 있다면 · 아니라면 · 비가 오면 우산을 집는다</li></ul><p class="muted small">"~하고", "~해서"로 이어진 문장은 여러 명령으로 나누어 실행해요. "적당히", "알아서", "많이"처럼 정확하지 않은 말은 모호한 명령으로 처리돼요. 반복·조건 안에 들어갈 명령은 → 버튼으로 들여써요.</p></section>
        <section class="panel"><h2>교사용 기능</h2><ul class="cmds"><li><b>실행 속도</b> 0.5배~2.5배</li><li><b>한 단계씩</b> 명령 한 줄씩 멈추며 실행</li><li><b>다시 보기</b> 결과 창에서 성공·실패 장면 재생</li><li><b>저장·불러오기</b> 모둠 이름으로 저장</li><li><b>비교</b> 기록 화면의 '비교' 버튼</li><li><b>전체화면</b> 실행 버튼 줄 오른쪽 끝</li><li><b>단축키</b> Ctrl+Enter 실행</li></ul><p class="muted small">기록은 이 브라우저에만 저장돼요.</p></section>
      </div>
      <button class="btn primary" onClick=${() => go('play', 1)}>미션 1 시작하기</button>
    </main>`;
  }

  /* ===================== 앱 ===================== */
  function App() {
    const [screen, setScreen] = useState(() => { const h = (location.hash || '').slice(1); return /^mission-[1-6]$/.test(h) ? 'play' : ['lab', 'records', 'guide'].includes(h) ? h : 'home'; });
    const [mid, setMid] = useState(() => { const m = (location.hash || '').match(/^#mission-([1-6])$/); return m ? +m[1] : 1; });
    const [records, setRecordsRaw] = useState(() => store.get('records', {}));
    const [saves, setSavesRaw] = useState(() => store.get('saves', []));
    const [settings, setSettingsRaw] = useState(() => store.get('settings', { speed: 1 }));
    const setRecords = r => { setRecordsRaw(r); store.set('records', r); };
    const setSaves = s => { setSavesRaw(s); store.set('saves', s); };
    const setSettings = s => { setSettingsRaw(s); store.set('settings', s); };
    const go = (s, m) => { setScreen(s); if (m) setMid(m); const h = s === 'play' ? 'mission-' + (m || mid) : s === 'home' ? '' : s; try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) { } window.scrollTo(0, 0); };
    useEffect(() => { const h = () => { const x = (location.hash || '').slice(1); const m = x.match(/^mission-([1-6])$/); if (m) { setScreen('play'); setMid(+m[1]); } else if (['lab', 'records', 'guide'].includes(x)) setScreen(x); else setScreen('home'); }; window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
    const mission = HW.MISSIONS.find(m => m.id === mid);
    return html`<div class="app">
      <header class="top">
        <button class="brand" onClick=${() => go('home')}><span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="9" fill="#2B3A8C"/><path d="M9 11h8M9 16h12M9 21h6" stroke="#9FB4FF" stroke-width="2.6" stroke-linecap="round"/><circle cx="23" cy="21" r="3" fill="#FFC93C"/></svg></span>백현우 알고리즘 챌린지</button>
        <nav>
          ${screen === 'play' ? html`<select class="mpick" value=${mid} onChange=${e => go('play', +e.target.value)} aria-label="미션 바로 선택">${HW.MISSIONS.map(m => html`<option key=${m.id} value=${m.id}>미션 ${m.id}. ${m.title}</option>`)}</select>` : null}
          <button class=${screen === 'home' ? 'on' : ''} onClick=${() => go('home')}>홈</button>
          <button class=${screen === 'lab' ? 'on' : ''} onClick=${() => go('lab')}>구조 연구소</button>
          <button class=${screen === 'records' ? 'on' : ''} onClick=${() => go('records')}>도전 기록</button>
          <button class=${screen === 'guide' ? 'on' : ''} onClick=${() => go('guide')}>사용 방법</button>
        </nav>
      </header>
      ${screen === 'home' ? html`<${Home} records=${records} go=${go}/>` : null}
      ${screen === 'play' ? html`<${Play} key=${'m' + mid} mission=${mission} records=${records} setRecords=${setRecords} saves=${saves} setSaves=${setSaves} settings=${settings} setSettings=${setSettings} onHome=${() => go('home')} onNext=${mid < 6 ? () => go('play', mid + 1) : null}/>` : null}
      ${screen === 'lab' ? html`<${Lab} records=${records} setRecords=${setRecords} saves=${saves} setSaves=${setSaves} settings=${settings} setSettings=${setSettings} onHome=${() => go('home')}/>` : null}
      ${screen === 'records' ? html`<${Records} records=${records} setRecords=${setRecords} saves=${saves} setSaves=${setSaves} go=${go}/>` : null}
      ${screen === 'guide' ? html`<${Guide} go=${go}/>` : null}
    </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
</body></html>
