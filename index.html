        <section class="panel"><h2>수업 흐름</h2><ol class="steps"><li>학생들이 종이에 알고리즘을 써요.</li><li>선생님이 오른쪽 편집기에 한 줄씩 옮겨 적어요. "여러 줄 한꺼번에"로 붙여 넣어도 돼요.</li><li><b>실행</b> 또는 <b>한 단계씩</b>으로 현우가 움직이는 모습을 함께 봐요. 이영이가 옆에서 한마디씩 거들어요.</li><li>실패하면 질문을 읽고, 어디를 고쳐야 할지 학생들이 먼저 이야기해요.</li><li>모둠별 알고리즘을 저장해 두었다가 기록 화면에서 나란히 비교해요.</li></ol></section>
        <section class="panel"><h2>현우가 알아듣는 말</h2><ul class="cmds"><li><b>이동</b> 앞으로 3칸 이동한다 · 뒤로 1칸 이동한다 · 의자 앞까지 이동한다</li><li><b>방향</b> 오른쪽으로 돈다 · 왼쪽으로 돈다 · 뒤로 돈다 · 화분을 바라본다</li><li><b>확인</b> 의자 위치를 확인한다 · 의자 방향을 확인한다 · 앞을 확인한다</li><li><b>물건</b> 책을 집는다 · 가방을 연다/닫는다 · 책을 가방에 넣는다 · 의자를 당긴다 · 물을 담는다 · 화분에 물을 2번 준다 · 우산을 친구에게 준다 · 우산을 내려놓는다</li><li><b>자세</b> 무릎을 굽힌다 · 의자에 앉는다 · 일어선다</li><li><b>반복</b> 3번 반복한다 · 앞에 벽이 없는 동안 반복한다 · 보물에 도착할 때까지 반복한다 · 앞으로 1칸 이동을 4번 반복한다</li><li><b>선택</b> 만약 비가 온다면 · 만약 앞에 벽이 있다면 · 아니라면 · 비가 오면 우산을 집는다</li></ul><p class="muted small">"~하고", "~해서"로 이어진 문장은 여러 명령으로 나누어 실행해요. "적당히", "알아서", "많이"처럼 정확하지 않은 말은 모호한 명령으로 처리돼요. 반복·조건 안에 들어갈 명령은 → 버튼으로 들여써요.</p></section>
        <section class="panel"><h2>교사용 기능</h2><ul class="cmds"><li><b>실행 속도</b> 0.5배~2.5배</li><li><b>한 단계씩</b> 명령 한 줄씩 멈추며 실행</li><li><b>다시 보기</b> 결과 창에서 성공·실패 장면 재생 (대사 포함)</li><li><b>저장·비교</b> 모둠 이름으로 저장 후 기록 화면에서 비교</li><li><b>설정</b> 효과음, 움직임 줄이기, 코미디 연출 강도</li><li><b>인내심 게이지</b> 재미를 위한 표시예요. 성공·실패에는 영향이 없어요.</li><li><b>교사용 모드</b> 상단의 🔒 버튼 → 교사 코드 입력 → 전체 정답·해설·인쇄</li><li><b>단축키</b> Ctrl+Enter 실행</li></ul><p class="muted small">기록은 이 브라우저에만 저장돼요. 교사용 모드는 보안 기능이 아니라, 수업 중 학생이 정답을 우연히 보는 것을 막는 편의 기능이에요.</p></section>
      </div>
      <button class="btn primary" onClick=${() => go('play', 1)}>미션 1 시작하기</button>
    </main>`;
  }

  /* ===================== 교사용 모드 ===================== */
  const TEACHER_CODE = '2656';
  const HWT = { _d: null, get() { if (!this._d) { const b = atob(window.__HWT || ''); const u = Uint8Array.from(b, c => c.charCodeAt(0)); this._d = JSON.parse(new TextDecoder().decode(u)); } return this._d; } };

  function CodeModal({ onOk, onClose }) {
    const [v, setV] = useState('');
    const [err, setErr] = useState(false);
    const ref = useRef(null);
    useEffect(() => { if (ref.current) ref.current.focus(); }, []);
    const submit = val => { if (val === TEACHER_CODE) onOk(); else { setErr(true); setV(''); if (ref.current) ref.current.focus(); } };
    const setVal = nv => { setV(nv); setErr(false); if (nv.length === 4) setTimeout(() => submit(nv), 140); };
    const pad = d => { if (v.length < 4) setVal(v + d); };
    return html`<div class="modal-back" onClick=${onClose}><div class=${'modal code-modal' + (err ? ' bad' : '')} onClick=${e => e.stopPropagation()} role="dialog" aria-label="교사용 모드 코드 입력">
      <h3>교사용 모드</h3>
      <p class="muted">교사용 기능입니다. 교사 코드를 입력해 주세요.</p>
      <div class="dots" aria-hidden="true">${[0, 1, 2, 3].map(i => html`<i key=${i} class=${i < v.length ? 'on' : ''}/>`)}</div>
      <input ref=${ref} class="code-in" type="password" inputMode="numeric" autoComplete="off" maxLength="4" value=${v} aria-label="교사 코드 4자리" placeholder="••••"
        onInput=${e => setVal(e.target.value.replace(/\D/g, '').slice(0, 4))}
        onKeyDown=${e => { if (e.key === 'Enter') { e.preventDefault(); submit(v); } else if (e.key === 'Escape') onClose(); }}/>
      <p class="code-err" role="alert">${err ? '코드가 맞지 않습니다. 다시 확인해 주세요.' : ''}</p>
      <div class="keypad">${['1', '2', '3', '4', '5', '6', '7', '8', '9'].map(d => html`<button key=${d} onClick=${() => pad(d)}>${d}</button>`)}<button class="k-sub" aria-label="한 글자 지우기" onClick=${() => setVal(v.slice(0, -1))}>⌫</button><button onClick=${() => pad('0')}>0</button><button class="k-sub" onClick=${() => submit(v)}>확인</button></div>
      <div class="row end"><button class="btn ghost" onClick=${onClose}>취소</button></div>
    </div></div>`;
  }

  const toPlain = arr => arr.map(t => ({ text: t.replace(/^>+/, ''), indent: (t.match(/^>*/) || [''])[0].length }));
  function ansText(m, alt) {
    const ls = alt ? m.alt.lines : m.lines.map(l => l.t);
    return `[미션 ${m.id}. ${m.title}]${alt ? ' (' + m.alt.name + ')' : ''}\n목표: ${m.goal}\n` + ls.map((t, i) => `${i + 1}. ${'  '.repeat((t.match(/^>*/) || [''])[0].length)}${t.replace(/^>+/, '')}`).join('\n');
  }
  function copyText(text, done, fail) {
    const legacy = () => { try { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'position:fixed;opacity:0;top:0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); document.body.removeChild(ta); ok ? done() : fail(); } catch (e) { fail(); } };
    try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(done, legacy); return; } } catch (e) { /* 아래 대체 방법 */ }
    legacy();
  }

  function AnsTable({ m, alt, showWhy, whyOpen, toggle }) {
    const ls = alt ? m.alt.lines.map(t => ({ t })) : m.lines;
    return html`<table class="t-table"><thead><tr><th>번호</th><th>명령</th>${alt ? null : html`<th>명령의 의미</th>`}${alt || showWhy ? null : html`<th class="no-print">이유</th>`}</tr></thead><tbody>
      ${ls.map((l, i) => { const ind = (l.t.match(/^>*/) || [''])[0].length; const open = showWhy || (whyOpen && whyOpen[m.id + '-' + i]);
        return html`<${React.Fragment} key=${i}><tr><td class="n">${i + 1}</td><td class="c" style=${{ paddingLeft: (10 + ind * 20) + 'px' }}>${l.t.replace(/^>+/, '')}</td>${alt ? null : html`<td>${l.mean}</td>`}${alt || showWhy ? null : html`<td class="no-print"><button class="btn ghost sm" aria-expanded=${!!open} onClick=${() => toggle(m.id + '-' + i)}>왜 필요한가?</button></td>`}</tr>
        ${!alt && open ? html`<tr class="why"><td></td><td colSpan="3"><b>왜 필요한가?</b> ${l.why}<br/><b>빠뜨리면?</b> ${l.miss}</td></tr>` : null}<//>`; })}
    </tbody></table>`;
  }

  function MissionDetail({ m, verified, whyOpen, toggle, sheet, onRun, onCopy }) {
    return html`<div class="t-detail">
      <p class="t-goal"><b>미션 목표</b> ${m.goal}</p>
      <div class="t-meta"><div><b>성공 조건</b><ul>${m.success.map(s => html`<li key=${s}>${s}</li>`)}</ul></div><div><b>사용 구조</b><p>${m.structs}</p><b>예상되는 현우의 행동</b><p>${m.behavior}</p></div></div>
      <h4>모범 알고리즘 ${verified ? html`<span class="verified">✔ 실행 엔진으로 검증됨</span>` : html`<span class="verified bad">⚠ 검증 실패</span>`}</h4>
      <${AnsTable} m=${m} showWhy=${!!sheet} whyOpen=${whyOpen} toggle=${toggle}/>
      ${m.alt ? html`<${React.Fragment}><h4>다른 방법: ${m.alt.name}</h4><p class="muted small">${m.alt.note}</p><${AnsTable} m=${m} alt=${true}/><//>` : null}
      <h4>정답 해설</h4><p>${m.explain}</p>
      <h4>자주 하는 실수</h4><ul>${m.mistakes.map(s => html`<li key=${s}>${s}</li>`)}</ul>
      ${sheet ? null : html`<div class="row no-print"><button class="btn run sm" onClick=${() => onRun(m)}>이 알고리즘으로 현우 움직이기</button><button class="btn ghost sm" onClick=${() => onCopy(ansText(m))}>이 미션 정답 복사</button></div>`}
    </div>`;
  }

  function TeacherScreen({ go, onExit }) {
    const T = HWT.get();
    const [tab, setTab] = useState('all');
    const [open, setOpen] = useState({ 1: true });
    const [whyOpen, setWhyOpen] = useState({});
    const [printView, setPrintView] = useState(false);
    const [toast, setToast] = useState('');
    const [copyBox, setCopyBox] = useState(null);
    const verify = useMemo(() => { const o = {}; T.missions.forEach(m => { const mi = HW.MISSIONS.find(x => x.id === m.id); const r = HW.run(mi, toPlain(m.lines.map(l => l.t)), { weather: 'rain' }); o[m.id] = r.result.success; }); return o; }, []);
    const say = t => { setToast(t); setTimeout(() => setToast(''), 2200); };
    const copy = text => copyText(text, () => say('정답을 복사했어요.'), () => setCopyBox(text));
    const allText = T.missions.map(m => ansText(m)).join('\n\n');
    const runAns = m => { store.set('prog-' + m.id, toPlain(m.lines.map(l => l.t))); go('play', m.id); };
    const toggleWhy = k => setWhyOpen(o => Object.assign({}, o, { [k]: !o[k] }));
    const expandAll = () => { const o = {}; T.missions.forEach(m => { o[m.id] = true; }); setOpen(o); setTab('detail'); };
    const collapseAll = () => { setOpen({}); setTab('detail'); };
    const doPrint = () => { setPrintView(true); setTimeout(() => { try { window.print(); } catch (e) { say('이 환경에서는 인쇄가 막혀 있어요. 새 탭에서 열어 인쇄해 주세요.'); } }, 350); };
    const Verified = ({ id }) => verify[id] ? html`<span class="verified">✔ 검증됨</span>` : html`<span class="verified bad">⚠ 검증 실패</span>`;

    if (printView) return html`<main class="teacher print-view">
      <div class="no-print t-actions"><button class="btn ghost" onClick=${() => setPrintView(false)}>← 교사용 화면으로</button><button class="btn primary" onClick=${doPrint}>인쇄하기</button><span class="muted small">인쇄할 때는 버튼과 배경이 나오지 않아요.</span></div>
      <h1 class="sheet-title">백현우 알고리즘 챌린지 · 교사용 정답과 해설</h1>
      ${T.missions.map(m => html`<section key=${m.id} class="sheet-mission"><h2>미션 ${m.id}. ${m.title}</h2><${MissionDetail} m=${m} verified=${verify[m.id]} sheet=${true}/></section>`)}
      ${toast ? html`<div class="toast no-print">${toast}</div>` : null}
    </main>`;

    return html`<main class="teacher">
      <div class="t-banner"><span class="t-state"><b>🔓 교사용 모드 활성화</b> 전체 정답과 해설을 볼 수 있어요.</span><button class="btn ghost sm" onClick=${onExit}>학생용 화면으로 돌아가기 (잠금)</button></div>
      <p class="muted small t-note">이 기능은 보안 인증이 아니라, 수업 중 학생이 정답을 우연히 보는 것을 막기 위한 편의 기능이에요. 이 화면을 나가거나 새로고침하면 다시 잠겨요.</p>
      <div class="t-tabs" role="tablist">${[['all', '전체 미션 정답 보기'], ['detail', '미션별 상세 알고리즘'], ['explain', '정답 해설']].map(([k, t]) => html`<button key=${k} role="tab" aria-selected=${tab === k} class=${tab === k ? 'on' : ''} onClick=${() => setTab(k)}>${t}</button>`)}</div>
      <div class="t-actions">
        <button class="btn ghost sm" onClick=${expandAll}>전체 정답 펼치기</button>
        <button class="btn ghost sm" onClick=${collapseAll}>전체 정답 접기</button>
        <button class="btn ghost sm" onClick=${() => copy(allText)}>정답 복사하기</button>
        <button class="btn ghost sm" onClick=${doPrint}>인쇄하기</button>
        <button class="btn ghost sm" onClick=${() => setPrintView(true)}>인쇄용 페이지 보기</button>
      </div>
      ${tab === 'all' ? html`<div class="t-grid">${T.missions.map(m => html`<article key=${m.id} class="t-card">
          <header><span class="m-no">${m.id}</span><div><h3>${m.title}</h3><small>${m.goal}</small></div><${Verified} id=${m.id}/></header>
          <ol class="ans">${m.lines.map((l, i) => { const ind = (l.t.match(/^>*/) || [''])[0].length; return html`<li key=${i} style=${{ paddingLeft: (ind * 18) + 'px' }}>${l.t.replace(/^>+/, '')}</li>`; })}</ol>
          <div class="row"><button class="btn run sm" onClick=${() => runAns(m)}>이 알고리즘으로 현우 움직이기</button><button class="btn ghost sm" onClick=${() => copy(ansText(m))}>복사</button></div>
        </article>`)}</div>` : null}
      ${tab === 'detail' ? html`<div class="t-acc">${T.missions.map(m => html`<section key=${m.id} class="t-item">
          <button class="t-head" aria-expanded=${!!open[m.id]} onClick=${() => setOpen(o => Object.assign({}, o, { [m.id]: !o[m.id] }))}><span class="m-no">${m.id}</span><b>${m.title}</b><span class="lvl">${'★'.repeat(m.level)}</span><span class="chev">${open[m.id] ? '▲' : '▼'}</span></button>
          ${open[m.id] ? html`<${MissionDetail} m=${m} verified=${verify[m.id]} whyOpen=${whyOpen} toggle=${toggleWhy} onRun=${runAns} onCopy=${copy}/>` : null}
        </section>`)}</div>` : null}
      ${tab === 'explain' ? html`<div class="t-exp">${T.missions.map(m => html`<article key=${m.id} class="t-card wide"><header><span class="m-no">${m.id}</span><div><h3>${m.title}</h3><small>${m.structs}</small></div></header><p>${m.explain}</p><b>예상되는 현우의 행동</b><p>${m.behavior}</p><b>자주 하는 실수</b><ul>${m.mistakes.map(s => html`<li key=${s}>${s}</li>`)}</ul></article>`)}</div>` : null}
      ${toast ? html`<div class="toast">${toast}</div>` : null}
      ${copyBox ? html`<div class="modal-back" onClick=${() => setCopyBox(null)}><div class="modal" onClick=${e => e.stopPropagation()} role="dialog" aria-label="정답 복사"><h3>정답 복사</h3><p class="muted">자동 복사가 막혀 있어요. 아래 글을 선택해서 복사(Ctrl+C)해 주세요.</p><textarea rows="14" readonly value=${copyBox} onFocus=${e => e.target.select()}/><div class="row end"><button class="btn primary" onClick=${() => setCopyBox(null)}>닫기</button></div></div></div>` : null}
    </main>`;
  }

  /* ===================== 앱 ===================== */
  function App() {
    const [screen, setScreen] = useState(() => { const h = (location.hash || '').slice(1); return /^mission-[1-6]$/.test(h) ? 'play' : ['lab', 'records', 'guide'].includes(h) ? h : 'home'; });
    const [mid, setMid] = useState(() => { const m = (location.hash || '').match(/^#mission-([1-6])$/); return m ? +m[1] : 1; });
    const [records, setRecordsRaw] = useState(() => store.get('records', {}));
    const [saves, setSavesRaw] = useState(() => store.get('saves', []));
    const [settings, setSettingsRaw] = useState(() => Object.assign({ speed: 1, sound: true, calm: false, level: 'full' }, store.get('settings', {})));
    const [teacher, setTeacher] = useState(false);
    const [codeFor, setCodeFor] = useState(null);
    const setRecords = r => { setRecordsRaw(r); store.set('records', r); };
    const setSaves = s => { setSavesRaw(s); store.set('saves', s); };
    const setSettings = s => { setSettingsRaw(s); store.set('settings', s); };
    const go = (s, m) => { setScreen(s); if (m) setMid(m); const h = s === 'play' ? 'mission-' + (m || mid) : (s === 'home' || s === 'teacher') ? '' : s; try { history.replaceState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) { /* 무시 */ } window.scrollTo(0, 0); };
    useEffect(() => { const h = () => { const x = (location.hash || '').slice(1); const m = x.match(/^mission-([1-6])$/); if (m) { setScreen('play'); setMid(+m[1]); } else if (['lab', 'records', 'guide'].includes(x)) setScreen(x); else setScreen(s => s === 'teacher' ? s : 'home'); }; window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);
    const askCode = cb => setCodeFor({ cb });
    const openTeacher = () => { if (teacher) go('teacher'); else askCode(() => { setTeacher(true); go('teacher'); }); };
    const exitTeacher = () => { setTeacher(false); go('home'); };
    const mission = HW.MISSIONS.find(m => m.id === mid);
    const shown = screen === 'teacher' && !teacher ? 'home' : screen;
    return html`<div class=${'app' + (settings.calm ? ' calm' : '')}>
      <header class="top">
        <button class="brand" onClick=${() => go('home')}><span class="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="9" fill="#2B3A8C"/><path d="M9 11h8M9 16h12M9 21h6" stroke="#9FB4FF" stroke-width="2.6" stroke-linecap="round"/><circle cx="23" cy="21" r="3" fill="#FFC93C"/></svg></span>백현우 알고리즘 챌린지</button>
        <nav>
          ${shown === 'play' ? html`<select class="mpick" value=${mid} onChange=${e => go('play', +e.target.value)} aria-label="미션 바로 선택">${HW.MISSIONS.map(m => html`<option key=${m.id} value=${m.id}>미션 ${m.id}. ${m.title}</option>`)}</select>` : null}
          <button class=${shown === 'home' ? 'on' : ''} onClick=${() => go('home')}>홈</button>
          <button class=${shown === 'lab' ? 'on' : ''} onClick=${() => go('lab')}>구조 연구소</button>
          <button class=${shown === 'records' ? 'on' : ''} onClick=${() => go('records')}>도전 기록</button>
          <button class=${shown === 'guide' ? 'on' : ''} onClick=${() => go('guide')}>사용 방법</button>
          ${teacher ? html`<span class="tchip"><button class=${shown === 'teacher' ? 'on' : ''} onClick=${() => go('teacher')}>🔓 교사용 정답</button><button onClick=${exitTeacher} title="다시 잠그기">잠그기</button></span>` : html`<button class="lockbtn" onClick=${openTeacher} aria-label="교사용 모드"><svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.6" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>교사용 모드</button>`}
        </nav>
      </header>
      ${shown === 'home' ? html`<${Home} records=${records} go=${go}/>` : null}
      ${shown === 'play' ? html`<${Play} key=${'m' + mid} mission=${mission} records=${records} setRecords=${setRecords} saves=${saves} setSaves=${setSaves} settings=${settings} setSettings=${setSettings} onHome=${() => go('home')} onNext=${mid < 6 ? () => go('play', mid + 1) : null} teacherOn=${teacher} askCode=${askCode}/>` : null}
      ${shown === 'lab' ? html`<${Lab} records=${records} setRecords=${setRecords} saves=${saves} setSaves=${setSaves} settings=${settings} setSettings=${setSettings} onHome=${() => go('home')} teacherOn=${teacher} askCode=${askCode}/>` : null}
      ${shown === 'records' ? html`<${Records} records=${records} setRecords=${setRecords} saves=${saves} setSaves=${setSaves} go=${go}/>` : null}
      ${shown === 'guide' ? html`<${Guide} go=${go}/>` : null}
      ${shown === 'teacher' ? html`<${TeacherScreen} go=${go} onExit=${exitTeacher}/>` : null}
      ${codeFor ? html`<${CodeModal} onClose=${() => setCodeFor(null)} onOk=${() => { const c = codeFor; setCodeFor(null); c.cb(); }}/>` : null}
    </div>`;
  }

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();
</script>
</body></html>
